name: "Build"

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - "**"

jobs:
    build:
        runs-on: ubuntu-latest
        name: "Build"
        timeout-minutes: 30
        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: "Setup Java"
                uses: actions/setup-java@v4
                with:
                    java-version: 21
                    distribution: temurin

            -   name: "Cache gradle"
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper/
                    key: ${{ runner.os }}-gradle
                    restore-keys: |
                        ${{ runner.os }}-gradle

            -   name: "Setup gradle"
                uses: gradle/actions/setup-gradle@v4
                with:
                    gradle-version: wrapper

            -   name: "Run wrapper"
                run: ./gradlew

            -   name: "Run build"
                run: ./gradlew build