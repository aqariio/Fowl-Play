name: "Publish"

on:
    workflow_dispatch:
        inputs:
            branches:
                description: "Branches"
                required: true
                default: "['1.20.1', '1.21.1']"
                type: string
permissions: { }

jobs:
    publish:
        name: "Publish"
        strategy:
            fail-fast: false
            matrix:
                branch: ${{ fromJson(inputs.branches) }}
        uses: ./.github/workflows/publish-branch.yml
        with:
            branch: ${{ matrix.branch }}
        secrets: inherit
        permissions:
            pull-requests: read
            contents: write