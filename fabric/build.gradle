plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "QuiltMC"
        url = "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        name = "modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://gitlab.com/api/v4/projects/21830712/packages/maven"
    }
    maven {
        name = "Xander Maven"
        url = "https://maven.isxander.dev/releases"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "SmartBrainLib (SBL) Maven Repo"
        url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name 'luck-repo'
        url 'https://repo.lucko.me/'
        content {
            includeModule 'me.lucko', 'spark-api'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Architectury
    modImplementation("dev.architectury:architectury-fabric:${architectury_version}")

    // Cloth Config
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")

    // Debug Utils
    modImplementation("io.github.flemmli97:debugutils:${debugutils_version}-fabric") {
        transitive = false
    }

    // Fabric Language Kotlin
    modRuntimeOnly("net.fabricmc:fabric-language-kotlin:${fabric_language_kotlin_version}")

    // Mod Menu
    modImplementation("com.terraformersmc:modmenu:${modmenu_version}") {
        transitive = false
    }

    // NBT Autocomplete
    modRuntimeOnly("maven.modrinth:nbt-autocomplete:${nbt_autocomplete_version}-fabric,1.21.1")

    // Observable
    modRuntimeOnly("maven.modrinth:observable:${observable_version}+fabric")

    // Smart Brain Lib
    modImplementation("net.tslat.smartbrainlib:SmartBrainLib-fabric-${minecraft_version}:${sbl_version}")

    // Spark
    modRuntimeOnly("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}")
    modRuntimeOnly("maven.modrinth:spark:${spark_version}-fabric")

    // Suggestion Tweaker
    modRuntimeOnly("maven.modrinth:suggestion-tweaker:${suggestion_tweaker_version}+fabric")

    // Yet Another Config Lib
    modImplementation("dev.isxander:yet-another-config-lib:${yacl_version}-fabric")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}