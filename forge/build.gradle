plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "${project.mod_id}.common.mixins.json"
        mixinConfig "${project.mod_id}.forge.mixins.json"

        runs {
            all {}

            data {
                data()
                programArgs("--all", "--mod", "${project.mod_id}")
                programArgs("--existing", project(":common").file("src/main/resources").absolutePath)
                programArgs("--output", project(":common").file("src/main/generated/resources").absolutePath)
                all {}
            }
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Mappings
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings_version:v2")
//        officialMojangMappings()
//        parchment("org.parchmentmc.data:parchment-${project.parchment_mappings_version}@zip")
    }

    // Forge
    forge "net.minecraftforge:forge:1.20.1-$rootProject.forge_version"

    // Architectury
    modImplementation("dev.architectury:architectury-forge:${rootProject.architectury_version}") {
        transitive = false
    }

    // Cloth Config
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")

    // Debug Utils
    modImplementation("io.github.flemmli97:debugutils:${project.debugutils_version}-forge") {
        transitive = false
    }

    // NBT Autocomplete
    modRuntimeOnly("maven.modrinth:nbt-autocomplete:${project.nbt_autocomplete_version}-forge,1.20.1")

    // Smart Brain Lib
    modImplementation("net.tslat.smartbrainlib:SmartBrainLib-forge-${project.minecraft_version}:${project.sbl_version}") {
        transitive = false
    }

    // Suggestion Tweaker
    modRuntimeOnly("maven.modrinth:suggestion-tweaker:${project.suggestion_tweaker_version}+forge")

    // Yet Another Config Lib
    modImplementation("dev.isxander:yet-another-config-lib:${project.yacl_version}-forge")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

def generatedResources = file("src/generated")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}