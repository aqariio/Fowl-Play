plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "QuiltMC"
        url = "https://maven.quiltmc.org/repository/release/"
    }
    maven {
        name = "modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        url = "https://gitlab.com/api/v4/projects/21830712/packages/maven"
    }
    maven {
        name = "Xander Maven"
        url = "https://maven.isxander.dev/releases"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "SmartBrainLib (SBL) Maven Repo"
        url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name 'luck-repo'
        url 'https://repo.lucko.me/'
        content {
            includeModule 'me.lucko', 'spark-api'
        }
    }
}

dependencies {
    // Architectury
    implementation("dev.architectury:architectury-neoforge:${architectury_version}") {
        transitive = false
    }

    // Cloth Config
    runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")

    // Debug Utils
    implementation("io.github.flemmli97:debugutils:${debugutils_version}-neoforge") {
        transitive = false
    }

    // Kotlin For Forge
//    runtimeOnly("maven.modrinth:kotlin-for-forge:${kotlin_for_forge_version}")

    // NBT Autocomplete
    runtimeOnly("maven.modrinth:nbt-autocomplete:${nbt_autocomplete_version}-neoforge,1.21.1")

    // Observable
//    runtimeOnly("maven.modrinth:observable:${observable_version}+neoforge")

    // Smart Brain Lib
    implementation("net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${sbl_version}")

    // Spark
    runtimeOnly("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}")
    runtimeOnly("maven.modrinth:spark:${spark_version}-neoforge")

    // Suggestion Tweaker
    runtimeOnly("maven.modrinth:suggestion-tweaker:${suggestion_tweaker_version}+neoforge")

    // Yet Another Config Lib
    implementation("dev.isxander:yet-another-config-lib:${yacl_version}-neoforge")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }